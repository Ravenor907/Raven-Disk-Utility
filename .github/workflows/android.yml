name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests and APKs
        env:
          RDU_KEYSTORE_B64: ${{ secrets.RDU_KEYSTORE_B64 }}
          RDU_KEYSTORE_PASSWORD: ${{ secrets.RDU_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RDU_KEYSTORE_B64" ]; then
            echo "$RDU_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export RDU_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
            echo "Signing with the release key from secrets"
          else
            unset RDU_KEYSTORE_PASSWORD
            echo "Signing with the shared test key"
          fi
          ./gradlew --no-daemon --stacktrace :core:test :app:assembleDebug :app:assembleRelease \
            2>&1 | tee build.log; status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then ci/annotate.sh build.log; exit $status; fi
          echo "::notice title=Core tests::$(grep -c ' PASSED' build.log) passed, $(grep -c ' SKIPPED' build.log) skipped (real-tool tests run in the next job)"
      - name: Name the APK
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "RavenDiskUtility-$v.apk"
          echo "APK=RavenDiskUtility-$v.apk" >> "$GITHUB_ENV"
          ls -l "RavenDiskUtility-$v.apk" app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ${{ env.APK }}
            app/build/outputs/apk/debug/app-debug.apk

  real-tools:
    # The app's disk code checked against the real Linux tools, both ways:
    # images made by mkfs/sgdisk must read correctly, and images the app makes must pass
    # sgdisk --verify, fsck, blkid, swapon and a real mount-write-remount.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gdisk fdisk dosfstools exfatprogs ntfs-3g btrfs-progs xfsprogs f2fs-tools udftools cryptsetup xorriso e2fsprogs parted
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe exfat || true
      - name: Images made by real tools
        run: ci/make-fixtures.sh "$RUNNER_TEMP/fixtures"
      - name: The app reads them like blkid does
        env:
          RAVEN_FIXTURES: ${{ runner.temp }}/fixtures
          RAVEN_EXPORT: ${{ runner.temp }}/export
          RAVEN_MIN_FIXTURES: "18"
        run: |
          ./gradlew --no-daemon :core:test --tests '*RealToolsTest*' --rerun-tasks 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          grep -E "Checked|RealToolsTest" test.log || true
          if [ $status -ne 0 ]; then ci/annotate.sh test.log; exit $status; fi
          grep -q "readsImagesMadeByRealTools PASSED" test.log && grep -q "exportImagesForRealTools PASSED" test.log
      - name: The real tools accept what the app writes
        run: ci/check-exports.sh "$RUNNER_TEMP/export"

  screens:
    permissions:
      contents: write
    # Boots an emulator, opens every screen on simulated drives (including a real run of a plan),
    # screenshots them and fails on any crash. Android 14 and Android 16 (the target).
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Put the debug APK where the script expects it
        run: mkdir -p app/build/outputs/apk/debug && cp apk/app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ci/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.api }}
          path: screens/
          if-no-files-found: ignore
      - name: Publish screenshots to a branch (easy to fetch and review)
        if: always() && github.event_name == 'push'
        run: |
          [ -d screens ] || exit 0
          branch="ci-screens/api-${{ matrix.api }}"
          cd screens
          git init -q && git checkout -q -b "$branch"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Screenshots from ${GITHUB_SHA::7} (API ${{ matrix.api }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$branch"

  release:
    # Publishes as soon as the APK builds (the other checks still run and report).
    # Publishes when main carries a versionName that has no release yet, so bumping versionName
    # in app/build.gradle.kts is what ships a build. 0.x builds are marked as pre-releases.
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish release if this version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="v$v"
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to publish"
          else
          pre=""
          case "$v" in 0.*) pre="--prerelease" ;; esac
          # Notes: this version's section of CHANGELOG.md, plus install steps.
          awk -v v="$v" '/^## /{p=($2==v)} p && !/^## /' CHANGELOG.md > notes.md
          printf '\n**Install:** download the APK below on your phone and open it. Plug in the drive with a USB-C adapter or hub and allow access when Android asks.\n' >> notes.md
          gh release create "$tag" "RavenDiskUtility-$v.apk" -R "${{ github.repository }}" --target "$GITHUB_SHA" $pre \
            --title "Raven Disk Utility $v" --notes-file notes.md
          fi
          # Keep every release's notes in step with CHANGELOG.md.
          for t in $(gh release list -R "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName'); do
            ver=${t#v}
            awk -v v="$ver" '/^## /{p=($2==v)} p && !/^## /' CHANGELOG.md > n.md
            [ -s n.md ] || continue
            printf '\n**Install:** download the APK below on your phone and open it. Plug in the drive with a USB-C adapter or hub and allow access when Android asks.\n' >> n.md
            gh release edit "$t" -R "${{ github.repository }}" --notes-file n.md
          done
